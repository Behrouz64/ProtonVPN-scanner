name: Build Windows app

on:
  workflow_dispatch:

env:
  APP_VERSION: '1.0.2'

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet CLI and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt flet-cli==1.0.4
      - name: Build Windows app
        run: flet build windows --yes -v
      - name: Zip app folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $folder = (Get-ChildItem -Path build/windows -Directory | Select-Object -First 1).FullName
          Compress-Archive -Path "$folder\*" -DestinationPath "dist/ProtonVPN-Scanner-$env:APP_VERSION-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
