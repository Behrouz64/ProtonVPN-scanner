name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK with flet build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt flet-cli==1.0.4

      - name: Build APK
        run: flet build apk -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProtonScanner-APK
          path: build/apk/*.apk
