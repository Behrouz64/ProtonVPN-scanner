name: Build apps

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build the Android APKs
        type: boolean
        default: true
      build_windows:
        description: Build the Windows app
        type: boolean
        default: false

env:
  APP_VERSION: '1.0.2'

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests qrcode
      - run: python -m unittest -v

  android:
    name: Android APK (${{ matrix.label }})
    needs: tests
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: legacy-32bit
            arch: armeabi-v7a
          - label: modern-64bit
            arch: arm64-v8a
          - label: universal
            arch: armeabi-v7a arm64-v8a x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet CLI and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt flet-cli==1.0.4
      - name: Build APK
        run: flet build apk --yes --arch ${{ matrix.arch }} -v
      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/apk/*.apk "dist/ProtonVPN-Scanner-${APP_VERSION}-android-${{ matrix.label }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.label }}
          path: dist/*.apk

  windows:
    name: Windows app
    needs: tests
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet CLI and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt flet-cli==1.0.4
      - name: Build Windows app
        run: flet build windows --yes -v
      - name: Zip app folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $folder = (Get-ChildItem -Path build/windows -Directory | Select-Object -First 1).FullName
          Compress-Archive -Path "$folder\*" -DestinationPath "dist/ProtonVPN-Scanner-$env:APP_VERSION-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
