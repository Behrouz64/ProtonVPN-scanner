[project]
name = "protonvpn-scanner"
version = "1.0.2"
description = "Find responsive ProtonVPN servers and export WireGuard and AmneziaWG configs."
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "flet-desktop==1.0.4",
    "requests",
    "qrcode",
]

[tool.flet]
product = "ProtonVPN Scanner"

[tool.flet.app]
exclude = ["docs", "tests", "tools", "README.md"]
